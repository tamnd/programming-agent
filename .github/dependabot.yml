version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["type: deps"]
    commit-message:
      prefix: "deps"
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: ["type: deps"]
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns: ["*"]

# SPDX-License-Identifier: Apache-2.0
# Builds the runner images of prog test (spec 08.7), tests them on the content repository, and pushes them to ghcr.io with build provenance. Only a push to main publishes.
name: Images

on:
  push:
    branches: [main]
    paths: [images/**, lang/**, .github/workflows/images.yml]
  pull_request:
    paths: [images/**, lang/**, .github/workflows/images.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: python, langs: python}
          - {image: go, langs: go}
          - {image: rust, langs: rust}
          - {image: gcc, langs: "c,cpp,bash"}
          - {image: node, langs: "javascript,typescript"}
          - {image: jvm, langs: "java,kotlin"}
          - {image: dotnet, langs: "csharp,powershell"}
          - {image: lean, langs: lean}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ${{ matrix.image }}
      LANGS: ${{ matrix.langs }}
      REF: ghcr.io/tamnd/prog-runner-${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamnd/programming
          path: content
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the image
        run: |
          docker build --pull --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$REF:latest" "images/$IMAGE"
          echo "ID=$(docker image inspect --format '{{.Id}}' "$REF:latest")" >> "$GITHUB_ENV"
      - name: Show the toolchain
        if: matrix.image == 'lean'
        run: docker run --rm --network none "$ID" lean --version
      - name: Test that a socket fails in the sandbox
        if: matrix.image == 'python'
        env:
          ALGO_TEST_PYTHON_IMAGE: ${{ env.ID }}
        run: go test ./lang -run TestSandboxNoNetwork -v
      # A block with deps= runs in an image with the packages of its lock file. The test builds that image on top of this image.
      - name: Test the packages of a lock file
        if: matrix.image == 'rust' || matrix.image == 'jvm'
        env:
          PROG_TEST_RUST_IMAGE: ${{ matrix.image == 'rust' && env.ID || '' }}
          PROG_TEST_JVM_IMAGE: ${{ matrix.image == 'jvm' && env.ID || '' }}
        run: go test ./lang -run TestDepsImage -v
      # The custom checkers run in the Python image. The official image is enough for them, so each job tests one image only.
      - name: Run the tests of the content repository in the image
        if: matrix.image != 'lean'
        run: |
          go build -o "$RUNNER_TEMP/prog" ./cmd/prog
          {
            echo "python: python:3.14-slim-trixie@sha256:930e1abba7c4e8f96ed93e8012c35d174d7732752731bbd5e8e757d7ec6f3966"
            for l in ${LANGS//,/ }; do echo "$l: $ID"; done
          } > "$RUNNER_TEMP/images.yaml"
          if [ "$IMAGE" = python ]; then echo "python: $ID" > "$RUNNER_TEMP/images.yaml"; fi
          cat "$RUNNER_TEMP/images.yaml"
          # The test corpus of this repository always runs. The content repository runs too when it has nodes.
          "$RUNNER_TEMP/prog" test -root testdata/corpus -sandbox docker -images "$RUNNER_TEMP/images.yaml" -lang "$LANGS" -out "$RUNNER_TEMP/results-corpus"
          if [ -d content/nodes ]; then
            "$RUNNER_TEMP/prog" test -root content -sandbox docker -images "$RUNNER_TEMP/images.yaml" -lang "$LANGS" -out "$RUNNER_TEMP/results"
          fi
      - name: Push the image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$REF:latest" "$REF:$GITHUB_SHA"
          docker push "$REF:latest"
          docker push "$REF:$GITHUB_SHA"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$REF:latest")
          echo "DIGEST=${digest#*@}" >> "$GITHUB_ENV"
          echo "$REF@${digest#*@}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          subject-name: ${{ env.REF }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

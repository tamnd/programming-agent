# The language register of spec 08.2. An implementation in a language merges only when the language is here (rule I12).
# The tests use four languages of the register.
- id: python
  name: Python
  tier: 1
  ext: [py]
  file_case: snake
  test: {framework: pytest, file: test_<name>.py}
  format: {tool: ruff format}
  lint: {tool: ruff, args: [check]}
  toolchain: Python 3.14, pytest 9
  run: python3 -m pytest
  comment: "#"
  highlight: python
  int: int
  list: list[int]
  since: 2026-11
- id: javascript
  name: JavaScript
  tier: 1
  ext: [js]
  file_case: camel
  test: {framework: "node:test", file: <name>.test.js}
  format: {tool: prettier}
  lint: {tool: eslint}
  toolchain: Node.js 24, ES modules
  run: node --test
  comment: "//"
  highlight: javascript
  int: number
  list: Array
  since: 2026-11
- id: go
  name: Go
  tier: 1
  ext: [go]
  file_case: snake
  test: {framework: testing, file: <name>_test.go}
  format: {tool: gofmt}
  lint: {tool: go vet}
  toolchain: Go 1.27
  run: go test
  comment: "//"
  highlight: go
  int: int
  list: "[]T"
  since: 2026-11
- id: rust
  name: Rust
  tier: 1
  ext: [rs]
  file_case: snake
  test: {framework: cargo test, file: tests/<name>_test.rs}
  format: {tool: rustfmt}
  lint: {tool: clippy, args: [-D, warnings]}
  toolchain: Rust stable, edition 2024
  run: cargo test
  comment: "//"
  highlight: rust
  int: i64
  list: "Vec<T> / &[T]"
  since: 2026-11
